# Dependency update cadence. Grouped + weekly to keep PR noise low on an active
# repo; security updates still open individually as Dependabot sees fit.
version: 2
updates:
  # Frontend app (root package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 7 (tsgo preview) removed tsconfig `baseUrl` and breaks
    # `tsc -b` (TS5102) — stay on 5.x until the config is migrated.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Backend Cloud Functions (its own npm package)
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
