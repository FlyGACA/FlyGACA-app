version: 2
updates:
  # Keep GitHub Actions pinned SHAs current — Dependabot bumps the SHA and the
  # `# vX` comment together. Without this, pinning freezes every action at the
  # commit it was pinned to, including the third-party
  # FirebaseExtended/action-hosting-deploy used by the hosting preview workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
