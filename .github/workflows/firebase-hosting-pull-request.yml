name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # Same-repo PRs only — forks can't read the service-account secret. Dependabot
    # is excluded for the same reason: its runs read from the *Dependabot* secret
    # store, not Actions secrets, so firebaseServiceAccount arrives empty and the
    # deploy action aborts with "Input required and not supplied:
    # firebaseServiceAccount". Skipping is correct — a dependency bump has no
    # preview worth publishing.
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm ci
      # Real public web config for flygaca-sa (Auth/Firestore) — mirrors deploy.yml
      # so previews exercise real Firebase sign-in, not the local-first fallback.
      # Injected from Actions variables, never copied from `.env.example` (which
      # ships placeholders that are truthy enough to boot Firebase and then fail
      # every Auth call — see the "Verify build env" note in deploy.yml).
      # VITE_MOYASAR_PUBLISHABLE_KEY is deliberately omitted: previews must fail
      # closed on billing (`billing-unavailable`), never reach live Moyasar.
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
      # Fail legibly when no service-account secret is configured. Without this
      # the deploy step writes an empty credentials file, firebase-tools logs
      # "No OAuth tokens found", calls the API unauthenticated, and surfaces a
      # bare 403 "The caller does not have permission" — which reads like an IAM
      # problem and sends you to the Google console instead of Actions secrets.
      # deploy.yml already guards its own secret this way; this workflow did not.
      - name: Verify Firebase service-account secret is set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLYGACA_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${SA}" ]; then
            echo "::error::No Firebase service-account secret found. Set FIREBASE_SERVICE_ACCOUNT_FLYGACA_APP (or FIREBASE_SERVICE_ACCOUNT) in Settings -> Secrets -> Actions. The service account must have firebase.projects.get on project flygaca-sa."
            exit 1
          fi
          echo "Service-account secret present ($(printf '%s' "${SA}" | wc -c) bytes)."

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Prefer the workflow's original secret; fall back to the one deploy.yml
          # uses, so a preview still works if only one of the two is configured.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLYGACA_APP || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: flygaca-sa
