name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job here only checks out code and uploads artifacts,
# neither of which needs a writable token. The repo default is already "read",
# so this pins the grant explicitly — it can't silently widen if that default is
# ever flipped back to "write", which would otherwise hand a write-all
# GITHUB_TOKEN to `npm ci` and every build script it runs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node 24, not 20: on Node 20 the v8 coverage provider reports 0% for every
      # file — the whole table, not a regression in any one of them — and the
      # ratchet then fails a suite that is actually at ~83%. The same commands on
      # Node 22/24 report real numbers and pass. Node 20 also went EOL in April
      # 2026, and the functions job below already runs 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Perf budget (per-chunk + total JS)
        run: npm run check:perf

  functions:
    name: functions · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Matches functions/package.json engines (root jobs stay on 20).
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Build
        run: npm run build

  rules:
    name: firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator is a Java process (firebase emulators:exec).
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          # 21+, not 17: firebase-tools v15 refuses to start the emulator on an
          # older runtime ("firebase-tools no longer supports Java version
          # before 21"), which failed this job outright.
          java-version: 21

      - run: npm ci

      - name: Firestore security-rules tests
        run: npm run test:rules

  e2e:
    name: e2e · a11y (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E + a11y (builds + previews dist)
        # e2e/ specs were deleted by the 2026-08-16 incident (config retained,
        # see CLAUDE.md); restoring them is a separate maintainer decision.
        # Playwright hard-fails ("Error: No tests found") on an empty spec
        # set rather than passing trivially, so skip explicitly until then.
        run: |
          if compgen -G "e2e/*.spec.ts" > /dev/null; then
            npm run test:e2e
          else
            echo "No e2e/*.spec.ts found — skipping (see CLAUDE.md)."
          fi

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
