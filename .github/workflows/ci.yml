name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job here only checks out code and uploads artifacts,
# neither of which needs a writable token. The repo default is already "read",
# so this pins the grant explicitly — it can't silently widen if that default is
# ever flipped back to "write", which would otherwise hand a write-all
# GITHUB_TOKEN to `npm ci` and every build script it runs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Perf budget (per-chunk + total JS)
        run: npm run check:perf

  functions:
    name: functions · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches functions/package.json engines (root jobs stay on 20).
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Unit tests + coverage ratchet
        run: npm run test:coverage

      - name: Build
        run: npm run build

  rules:
    name: firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator is a Java process (firebase emulators:exec).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21+, not 17: firebase-tools v15 refuses to start the emulator on an
          # older runtime ("firebase-tools no longer supports Java version
          # before 21"), which failed this job outright.
          java-version: 21

      - run: npm ci

      - name: Firestore security-rules tests
        run: npm run test:rules

  e2e:
    name: e2e · a11y (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E + a11y (builds + previews dist)
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
